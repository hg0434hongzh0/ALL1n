name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows amd64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure MinGW C toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw --no-progress -y
            $gcc = Get-ChildItem "C:\ProgramData\chocolatey\lib\mingw" -Recurse -Filter gcc.exe | Select-Object -First 1
            if (-not $gcc) { throw "MinGW gcc was not found after installation" }
            Split-Path $gcc.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Test and package
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: ./package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: |
            dist/ALL1n-*-windows-amd64.zip
            dist/ALL1n-*-windows-amd64.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and package app bundle
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/ALL1n-*-macos-${{ matrix.arch }}.zip
            dist/ALL1n-*-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Verify release version
        shell: bash
        run: |
          version="$(sed -n 's/^const appVersion = "\([^"]*\)"/\1/p' report.go | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Publish release with all platform packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.sha256' \) -print0 | sort -z)
          if [ "${#assets[@]}" -ne 6 ]; then
            printf 'Expected 6 release assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ALL1n ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
